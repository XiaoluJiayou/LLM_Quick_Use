[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-quick-use"
version = "0.1.0"
description = "Reusable utilities and examples for model evaluation and data processing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["requests>=2.28", "openai>=1.40"]
data = ["pandas>=2.0", "PyYAML>=6.0", "openpyxl>=3.1", "tqdm>=4.64"]
download = ["huggingface-hub>=0.26"]
modelscope = ["modelscope>=1.20"]
clip = ["torch>=2.4", "transformers>=4.45", "Pillow>=10", "numpy>=1.24"]
train = ["torch>=2.4", "torchvision>=0.19", "matplotlib>=3.7", "numpy>=1.24"]
video = ["opencv-python>=4.8", "Pillow>=10", "numpy>=1.24", "tqdm>=4.64"]
qwen-vl = ["torch>=2.6", "transformers>=4.57", "accelerate", "Pillow>=10"]
test = ["pandas>=2.0", "PyYAML>=6.0", "Pillow>=10", "numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["llm_quick_use*"]
